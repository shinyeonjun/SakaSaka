name: intent-world-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:api
      - run: npm test -- --run
      - run: npm run build
      - run: npm run acceptance:desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run acceptance
      - run: npm run acceptance:api
      - run: npm run acceptance:autonomous
      - run: npm run acceptance:experiments
      - run: npm run acceptance:ui

  security-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - run: npm test -- --run src/security.test.ts
      - run: git diff --check

  native-codex-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor bubblewrap uidmap
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            # GitHub-hosted Ubuntu may enforce the AppArmor userns restriction.
            # Allow only the system Bubblewrap executable used by this fixture;
            # do not disable the restriction globally on the runner.
            printf '%s\n' \
              'abi <abi/4.0>,' \
              'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' \
              '  userns,' \
              '  include if exists <local/bwrap>' \
              '}' | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo apparmor_parser --replace /etc/apparmor.d/bwrap
          fi
          bwrap --version
      - name: Install pinned public Codex binary (no login)
        run: npm install --prefix "$RUNNER_TEMP/native-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.154.0
      - name: Native agent and sandbox integration with local scripted model
        env:
          # The fixture has no credentials and only uses local mock/preview ports.
          # GitHub-hosted runners may deny bwrap's network namespace setup.
          NATIVE_ACCEPTANCE_SANDBOX_NETWORK: "1"
        run: |
          export SAKASAKA_TEST_CODEX_BIN="$RUNNER_TEMP/native-codex/node_modules/.bin/codex"
          "$SAKASAKA_TEST_CODEX_BIN" --version
          # The hosted runner's outer container denies unprivileged userns;
          # this credential-free, disposable fixture needs root only so
          # Bubblewrap can create its normal workspace-write sandbox.
          sudo -E env "PATH=$PATH" npm run acceptance:native
