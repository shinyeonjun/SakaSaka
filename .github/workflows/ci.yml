name: intent-world-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:api
      - run: npm test -- --run
      - run: npm run build
      - run: npm run acceptance:desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run acceptance
      - run: npm run acceptance:api
      - run: npm run acceptance:autonomous
      - run: npm run acceptance:experiments
      - run: npm run acceptance:ui

  tauri-desktop-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sidecar paths for Rust-only compile check
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/sakasaka-api-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/sakasaka-worker-x86_64-unknown-linux-gnu
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - name: Check Tauri desktop bridge
        shell: bash
        run: |
          rustc --version
          if ! cargo check -q --manifest-path src-tauri/Cargo.toml 2> "$RUNNER_TEMP/tauri-check.err"; then
            echo "Tauri cargo check failed:"
            tail -n 120 "$RUNNER_TEMP/tauri-check.err"
            exit 1
          fi

  tauri-windows-compile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows sidecar paths for Rust-only compile check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/binaries/sakasaka-api-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/binaries/sakasaka-worker-x86_64-pc-windows-msvc.exe | Out-Null
      - name: Check Windows Tauri desktop bridge
        shell: pwsh
        run: |
          rustc --version
          cargo check -q --manifest-path src-tauri/Cargo.toml

  security-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - run: npm test -- --run src/security.test.ts
      - run: git diff --check

  native-codex-integration:
    # Codex's Bubblewrap workspace sandbox needs unprivileged user namespaces.
    # Keep this job on the supported 22.04 hosted image; ubuntu-latest may run
    # under a hardened outer container that denies that kernel capability.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap uidmap
          bwrap --version
      - name: Install pinned public Codex binary (no login)
        run: npm install --prefix "$RUNNER_TEMP/native-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.154.0
      - name: Native agent and sandbox integration with local scripted model
        env:
          # The fixture has no credentials and only uses local mock/preview ports.
          # GitHub-hosted runners may deny bwrap's network namespace setup.
          NATIVE_ACCEPTANCE_SANDBOX_NETWORK: "1"
        run: |
          export SAKASAKA_TEST_CODEX_BIN="$RUNNER_TEMP/native-codex/node_modules/.bin/codex"
          "$SAKASAKA_TEST_CODEX_BIN" --version
          npm run acceptance:native
